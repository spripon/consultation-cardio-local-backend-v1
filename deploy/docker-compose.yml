# Pile auto-hebergee Ubuntu : frontend/Caddy local + API locale.
# Exposition Internet attendue via Cloudflare Tunnel deja present sur l'hote :
# consultation.cardiologie-tarbes.org -> http://127.0.0.1:8091
# Aucun port FastAPI n'est publie sur l'hote.
services:
  api:
    build:
      context: ../backend
    container_name: cardio-api
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./models:/models:ro
    tmpfs:
      - /tmp/consultation-cardio:size=512m,mode=1700
      - /tmp:size=1g,mode=1777
    expose:
      - "8000"
    networks:
      - backend_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          memory: 4g

  web:
    # Le frontend est compile dans l'image. Caddy ecoute :80 DANS le conteneur,
    # mais l'hote ne l'expose que sur la boucle locale IPv4 127.0.0.1:8091.
    # cloudflared, execute sur le meme serveur Ubuntu, doit utiliser
    # http://127.0.0.1:8091 comme Service URL.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: cardio-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8091:80"
    env_file:
      - ./caddy.env
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      # Web et API partagent uniquement le reseau interne Docker. Le web n'a
      # pas besoin d'egress Internet : le tunnel Cloudflare tourne sur l'hote.
      - backend_internal
    security_opt:
      - no-new-privileges:true

networks:
  backend_internal:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
