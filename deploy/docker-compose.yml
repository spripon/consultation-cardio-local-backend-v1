# Pile auto-hébergée Ubuntu : Caddy (seul exposé) + API locale + frontend statique.
# Aucun service cloud, aucune base de données externe.
services:
  api:
    build:
      context: ../backend
    container_name: cardio-api
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # Modèles PII / Whisper téléchargés au préalable sur la machine hôte.
      - ./models:/models:ro
    tmpfs:
      - /tmp/consultation-cardio:size=512m,mode=1700
      # Système de fichiers racine en lecture seule : /tmp doit rester inscriptible
      # (fichiers temporaires OCR, effacés à l'arrêt du conteneur).
      - /tmp:size=1g,mode=1777
    # Aucun port publié : uniquement joignable par Caddy sur le réseau interne.
    expose:
      - "8000"
    networks:
      # UNIQUEMENT le réseau `internal: true` : Docker ne crée aucune route de
      # sortie (pas de gateway NAT), donc l'API n'a aucun accès Internet au
      # runtime, même si un paquet tentait un appel externe.
      - backend_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          memory: 4g

  web:
    # Image construite depuis la racine du dépôt : le frontend est compilé dans
    # l'étape builder (node:22-alpine), donc AUCUN Node/npm n'est requis sur
    # l'hôte Ubuntu et aucun dist/ hôte n'est nécessaire.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: cardio-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    # OBLIGATOIRE : identifiants Basic Auth. Si deploy/caddy.env est absent,
    # `docker compose up` échoue au lieu de publier un site sans authentification.
    env_file:
      - ./caddy.env
    volumes:
      # Caddyfile et frontend statique sont dans l'image (deploy/Dockerfile.web).
      - caddy_data:/data
      - caddy_config:/config
    networks:
      # `backend_internal` pour joindre l'API, `edge` pour ACME/HTTPS public.
      - backend_internal
      - edge
    security_opt:
      - no-new-privileges:true

networks:
  backend_internal:
    driver: bridge
    internal: true
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: